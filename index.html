<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Na Chapa Macarrão Delivery</title>
<style>
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}header{text-align:center;padding:24px;background:#170003;border-bottom:3px solid #e10613}.logo{font-size:34px;font-weight:900}.red{color:#e10613}.wrap{max-width:1000px;margin:auto;padding:18px}.box,.card{background:#171717;border:1px solid #4b1015;border-radius:14px;padding:15px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.btn,button{background:#e10613;color:#fff;border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer}.gray{background:#333}.muted{color:#aaa;font-size:13px}.price{font-size:18px;font-weight:bold}.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:15px}.modal.on{display:flex}.modalbox{width:min(650px,100%);max-height:94vh;overflow:auto;background:#161616;border:1px solid #651018;border-radius:15px;padding:18px}input,select,textarea{width:100%;padding:10px;background:#111;color:#fff;border:1px solid #444;border-radius:8px;margin:5px 0}.item{border-bottom:1px solid #333;padding:10px 0}
</style></head><body>
<header><div class="logo">NA <span class="red">CHAPA</span></div><div>MACARRÃO DELIVERY • JANTINHA NA CHAPA</div><div>📲 27 98111-5864</div></header>
<main class="wrap">
<div class="box"><b>🚚 Entregamos nestes bairros</b><br><button class="gray" onclick="showAreas()">Ver bairros e taxas</button> • Pedido mínimo: <b id="minLabel">R$ 20,00</b></div>
<h2>🍝 Macarrão na Chapa</h2><div id="produtos" class="grid"></div>
<h2>🍽️ Jantinha na Chapa</h2><div id="jantinhas" class="grid"></div>
<div class="box"><h2>🛒 Seu pedido</h2><div id="carrinho">Seu carrinho está vazio.</div><h3>Subtotal: <span id="subtotal">R$ 0,00</span></h3><button onclick="checkout()">FINALIZAR PEDIDO</button></div>
</main>
<div id="modal" class="modal"><div class="modalbox"><button class="gray" style="float:right" onclick="closeM()">✕</button><div id="mc"></div></div></div>
<footer style="text-align:center;color:#aaa;padding:25px">@nachapamacarrao.serra</footer>
<script>
const SUPABASE_URL="https://jadruovvzvubiujoyfgx.supabase.co";
const SUPABASE_KEY="sb_publishable_SgIXosTtTVDGlheKBr73zg_llUnfrhp";
let ps=[],js=[],adds=[],areas=[],cfg={},cart=[],current=null,size="P";
const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
async function rest(path,opt={}){let r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}
async function rpc(name,body){let r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+name,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return await r.json()}
async function start(){if(SUPABASE_KEY.includes("COLE_"))return alert("Coloque sua Publishable Key no index.html antes de publicar.");try{[ps,js,adds,areas]=await Promise.all([rest("produtos?select=*&disponivel=eq.true&order=id"),rest("jantinhas?select=*&disponivel=eq.true&order=id"),rest("adicionais?select=*&disponivel=eq.true&order=id"),rest("bairros?select=*&disponivel=eq.true&order=nome")]);let c=await rest("configuracoes?select=chave,valor");(c||[]).forEach(x=>cfg[x.chave]=x.valor);minLabel.textContent=money(Number(cfg.pedido_minimo||20));render()}catch(e){console.error(e);alert("Erro ao carregar o cardápio. Confira a Publishable Key e as políticas.")}}
function render(){produtos.innerHTML=ps.map((p,i)=>card(p,"p",i)).join("")||"<div class='card'>Nenhum produto.</div>";jantinhas.innerHTML=js.map((p,i)=>card(p,"j",i)).join("")||"<div class='card'>Nenhuma jantinha.</div>";renderCart()}
function card(p,t,i){return `<div class="card"><h3>${esc(p.nome)}</h3><p class="muted">${esc(p.descricao||"")}</p><div class="price">P ${money(p.preco_p)} • G ${money(p.preco_g)}</div><button onclick="choose('${t}',${i})">ESCOLHER</button></div>`}
function choose(t,i){current={t,i};let p=t==="p"?ps[i]:js[i];size="P";mc.innerHTML=`<h2>${esc(p.nome)}</h2><p>Tamanho</p><button onclick="size='P'">P — ${money(p.preco_p)}</button> <button onclick="size='G'">G — ${money(p.preco_g)}</button><h3>Adicionais</h3>${adds.map((a,j)=>`<label><input class="ac" type="checkbox" value="${j}"> ${esc(a.nome)} (+${money(a.preco)})</label>`).join("")}<label>Quantidade<input id="qty" type="number" min="1" value="1"></label><button onclick="addItem()">ADICIONAR</button>`;openM()}
function addItem(){let p=current.t==="p"?ps[current.i]:js[current.i],base=Number(size==="P"?p.preco_p:p.preco_g),aa=[...document.querySelectorAll(".ac:checked")].map(x=>adds[+x.value]),extra=aa.reduce((s,a)=>s+Number(a.preco),0),q=Math.max(1,+qty.value||1);cart.push({nome:p.nome,tipo:current.t,id:p.id,tamanho:size,q,unit:base+extra,adds:aa.map(a=>a.nome),sub:(base+extra)*q});closeM();renderCart()}
function renderCart(){let s=cart.reduce((a,x)=>a+x.sub,0);subtotal.textContent=money(s);carrinho.innerHTML=cart.length?cart.map((x,i)=>`<div class="item"><b>${x.q}x ${esc(x.nome)} ${x.tamanho}</b><br>${esc(x.adds.join(", ")||"Sem adicionais")} — ${money(x.sub)} <button class="gray" onclick="cart.splice(${i},1);renderCart()">Remover</button></div>`).join(""):"Seu carrinho está vazio."}
function showAreas(){mc.innerHTML="<h2>🚚 Bairros atendidos</h2>"+areas.map(a=>`<p>📍 <b>${esc(a.nome)}</b> — ${Number(a.taxa)?money(a.taxa):"taxa a confirmar"}</p>`).join("");openM()}
function checkout(){let s=cart.reduce((a,x)=>a+x.sub,0),m=Number(cfg.pedido_minimo||20);if(!cart.length)return alert("Adicione um item.");if(s<m)return alert("Pedido mínimo: "+money(m));mc.innerHTML=`<h2>Finalizar pedido</h2><label>Nome<input id="cn"></label><label>WhatsApp<input id="cp"></label><label>Endereço<input id="ce"></label><label>Bairro<select id="cb"><option value="">Selecione</option>${areas.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join("")}</select></label><label>Pagamento<select id="pay"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select></label><label>Troco para<input id="troco" type="number" step=".01"></label><label>Observação<textarea id="obs"></textarea></label><button onclick="sendOrder()">CONFIRMAR</button>`;openM()}
async function sendOrder(){let nome=cn.value.trim(),fone=cp.value.trim(),end=ce.value.trim(),bid=+cb.value;if(!nome||!fone||!end||!bid)return alert("Preencha nome, WhatsApp, endereço e bairro.");let b=areas.find(x=>x.id===bid),sub=cart.reduce((a,x)=>a+x.sub,0),tax=+b.taxa||0,total=sub+tax;let payload={p_cliente_nome:nome,p_telefone:fone,p_endereco:end,p_bairro_id:bid,p_pagamento:pay.value,p_troco_para:+troco.value||null,p_subtotal:sub,p_taxa_entrega:tax,p_total:total,p_observacao:obs.value,p_itens:cart.map(x=>({nome_produto:x.nome,produto_id:x.tipo==="p"?x.id:null,jantinha_id:x.tipo==="j"?x.id:null,tamanho:x.tamanho,quantidade:x.q,preco_unitario:x.unit,adicionais:x.adds.join(", "),subtotal:x.sub}))};try{let r=await rpc("criar_pedido",payload),id=Array.isArray(r)?r[0].pedido_id:r.pedido_id||r;alert("Pedido enviado! #"+id);window.open("https://wa.me/5527981115864?text="+encodeURIComponent("Olá! Fiz o pedido #"+id+" pelo site. Total: "+money(total)),"_blank");cart=[];closeM();renderCart()}catch(e){console.error(e);alert("Erro ao enviar. Execute o SQL 02_rpc_criar_pedido.sql e confira a Publishable Key.")}}
function openM(){modal.classList.add("on")}function closeM(){modal.classList.remove("on")}start();
</script></body></html>
